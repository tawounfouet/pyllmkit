name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src/pyllmkit
      - name: Offline domain and acceptance tests with branch coverage
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GOOGLE_API_KEY: ""
          MISTRAL_API_KEY: ""
          AWS_ACCESS_KEY_ID: ""
        run: |
          python -m pytest -q --cov=pyllmkit.domain --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - name: P7 L7.1 application and fake adapter branch coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l71_inference_kernel.py --cov=pyllmkit.application.inference --cov=pyllmkit.adapters.inference.fake --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: P7 L7.2 security and adapter composition coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l72_secure_adapter_registry.py --cov=pyllmkit.adapters.inference.security --cov=pyllmkit.adapters.inference.registry --cov=pyllmkit.adapters.inference.routing --cov=pyllmkit.adapters.inference.errors --cov=pyllmkit.protocols.credentials --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.3 Ollama mapping and transport branch coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l73_ollama_adapter.py --cov=pyllmkit.adapters.inference.ollama --cov=pyllmkit.adapters.inference.ollama_mapping --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.4 OpenAI Responses adapter and mapping coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l74_openai_responses.py --cov=pyllmkit.adapters.inference.openai_responses --cov=pyllmkit.adapters.inference.openai_responses_mapping --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.5 Anthropic Messages adapter and mapping coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l75_anthropic_messages.py --cov=pyllmkit.adapters.inference.anthropic_messages --cov=pyllmkit.adapters.inference.anthropic_messages_mapping --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.5b Gemini and common cloud HTTP branch coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l75b_google_gemini.py --cov=pyllmkit.adapters.inference.google_gemini --cov=pyllmkit.adapters.inference.google_gemini_mapping --cov=pyllmkit.adapters.inference.cloud_http --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.5c xAI Responses mapping and adapter branch coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l75c_xai_responses.py --cov=pyllmkit.adapters.inference.xai_responses --cov=pyllmkit.adapters.inference.xai_responses_mapping --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.5d Mistral Chat mapping and adapter branch coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l75d_mistral_chat.py --cov=pyllmkit.adapters.inference.mistral_chat --cov=pyllmkit.adapters.inference.mistral_chat_mapping --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: P7 L7.6 six-provider stream mapping and transport branch coverage
        run: |
          python -m pytest -q tests/acceptance/test_p7_l76_native_streaming.py tests/acceptance/test_p7_l76_security_lifecycle.py --cov=pyllmkit.adapters.inference.native_stream_mapping --cov=pyllmkit.adapters.inference.native_stream_transport --cov=pyllmkit.application.inference.streaming --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Offline examples
        run: |
          python examples/01_define_model.py
          python examples/02_define_artifacts.py
          python examples/03_define_capabilities.py
          python examples/04_define_text_content.py
          python examples/05_define_text_message.py
          python examples/06_define_multimodal_message.py
          python examples/07_round_trip_interaction.py
          python examples/08_define_inference_request.py
          python examples/09_define_inference_response.py
          python examples/10_define_inference_run.py
          python examples/11_round_trip_inference_json.py
          python examples/12_full_inference_walkthrough.py
          python examples/13_define_tools.py
          python examples/14_define_tool_call_and_result.py
          python examples/15_validate_structured_output.py
          python examples/16_tooling_json_round_trip.py
          python examples/17_full_tooling_walkthrough.py
          python examples/18_stream_text_events.py
          python examples/19_stream_tool_call_events.py
          python examples/20_stream_sync_async.py
          python examples/21_streaming_json_round_trip.py
          python examples/22_full_streaming_walkthrough.py
          python examples/23_define_provider_deployment.py
          python examples/24_registry_search.py
          python examples/25_effective_capabilities_limits.py
          python examples/26_deployment_resolution.py
          python examples/27_offline_discovery_merge.py
          python examples/28_full_registry_walkthrough.py
          python examples/29_offline_inference_kernel.py
          python examples/30_secure_registry_fake.py
          python examples/31_ollama_mock_transport.py
          python examples/32_ollama_live_opt_in.py
          python examples/33_openai_responses_mock.py
          python examples/34_anthropic_messages_mock.py
          python examples/35_google_gemini_mock.py
          python examples/36_xai_responses_mock.py
          python examples/37_mistral_chat_mock.py
          python examples/38_six_provider_offline_registry.py
          python examples/39_native_streaming_contracts.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Wheel clean environment smoke
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-index --no-deps dist/*.whl
          .venv-wheel/bin/python -c "from pyllmkit.domain import Content, Message, Role, TextContent, message_to_dict, message_from_dict; m=Message(Role.USER, Content((TextContent('x'),))); assert message_from_dict(message_to_dict(m)) == m"
      - name: P7 L7.5d Mistral clean wheel without HTTPX import
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.adapters.inference import MistralChatAdapter, CredentialRef, ProviderConnectionConfig; assert ProviderConnectionConfig.mistral(CredentialRef('demo')).profile.value == 'mistral'"
      - name: P7 L7.5c xAI clean wheel without HTTPX import
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.adapters.inference import XAIResponsesAdapter, CredentialRef, ProviderConnectionConfig; assert ProviderConnectionConfig.xai(CredentialRef('demo')).profile.value == 'xai'"
      - name: P7 L7.5b Google clean wheel without HTTPX import
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.adapters.inference import GoogleGeminiAdapter, CredentialRef, ProviderConnectionConfig; assert ProviderConnectionConfig.google(CredentialRef('demo')).profile.value == 'google'"
      - name: P7 L7.5 clean wheel without HTTPX import smoke
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.adapters.inference import AnthropicMessagesAdapter, ProviderConnectionConfig, CredentialRef; assert ProviderConnectionConfig.anthropic(CredentialRef('demo')).profile.value == 'anthropic'"
      - name: P7 L7.4 clean wheel without HTTPX import smoke
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.adapters.inference import OpenAIResponsesAdapter, ProviderConnectionConfig, CredentialRef; assert ProviderConnectionConfig.openai(CredentialRef('demo')).profile.value == 'openai'"
      - name: P7 L7.3 clean wheel without HTTPX import smoke
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.adapters.inference import OllamaAdapter, ProviderConnectionConfig; a = OllamaAdapter(ProviderConnectionConfig.ollama_local()); assert a.allow_live is False"
      - name: P4 L4.1 wheel smoke
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.domain.tooling import Tool, ToolSchema, ToolChoice, validate_tool_set, validate_tool_choice; t=Tool('demo', None, ToolSchema({'type':'object'})); validate_tool_choice(ToolChoice.specific('demo'),validate_tool_set((t,)))"
          .venv-wheel/bin/python examples/13_define_tools.py
      - name: P4 L4.2 wheel smoke
        run: |
          .venv-wheel/bin/python examples/14_define_tool_call_and_result.py
      - name: P4 L4.3 wheel smoke
        run: |
          .venv-wheel/bin/python examples/15_validate_structured_output.py
      - name: P4 L4.4 wheel codec and composition smoke
        run: |
          .venv-wheel/bin/python examples/16_tooling_json_round_trip.py
      - name: P4 L4.5 installed wheel full tooling walkthrough
        run: |
          .venv-wheel/bin/python examples/17_full_tooling_walkthrough.py
      - name: P5 installed wheel streaming smoke
        run: |
          .venv-wheel/bin/python examples/18_stream_text_events.py
          .venv-wheel/bin/python examples/19_stream_tool_call_events.py
          .venv-wheel/bin/python examples/20_stream_sync_async.py
          .venv-wheel/bin/python examples/21_streaming_json_round_trip.py
          .venv-wheel/bin/python examples/22_full_streaming_walkthrough.py
          .venv-wheel/bin/python examples/23_define_provider_deployment.py
          .venv-wheel/bin/python examples/24_registry_search.py
          .venv-wheel/bin/python examples/25_effective_capabilities_limits.py
          .venv-wheel/bin/python examples/26_deployment_resolution.py
          .venv-wheel/bin/python examples/27_offline_discovery_merge.py
          .venv-wheel/bin/python examples/28_full_registry_walkthrough.py
      - name: L3.1 clean wheel smoke
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.domain import Content, InferenceRequest, Message, ModelId, ModelTarget, Role, TextContent; r=InferenceRequest(ModelTarget(ModelId('smoke')), (Message(Role.USER, Content((TextContent('x'),))),)); assert r.target.kind == 'model'"
      - name: L3.2 clean wheel smoke
        run: |
          .venv-wheel/bin/python -c "from pyllmkit.domain import InferenceResponse, InferenceRunId, TextOutput, Usage; x=InferenceResponse(InferenceRunId('smoke'), TextOutput(''), usage=Usage(output_tokens=0)); assert x.usage.output_tokens == 0"
      - name: L3.3 clean wheel smoke
        run: |
          .venv-wheel/bin/python -c "from datetime import datetime, timezone; from pyllmkit.domain import Content, Message, Role, TextContent, ModelId, ModelTarget, InferenceRequest, InferenceRun, InferenceRunId, InferenceResponse, TextOutput, InferenceRunState; r=InferenceRun(InferenceRunId('smoke'), InferenceRequest(ModelTarget(ModelId('model')), (Message(Role.USER, Content((TextContent('hi'),))),))); now=datetime(2026,11,5,tzinfo=timezone.utc); done=r.start(now).complete(InferenceResponse(r.run_id, TextOutput('ok')), now); assert done.state is InferenceRunState.COMPLETED"
      - name: L3.4 clean wheel codec smoke
        run: |
          .venv-wheel/bin/python -c "import json; from pyllmkit.domain import Content, Message, Role, TextContent, ModelId, ModelTarget, InferenceRequest, InferenceRun, InferenceRunId, request_to_dict, request_from_dict, run_to_dict, run_from_dict, INFERENCE_SCHEMA_VERSION; req=InferenceRequest(ModelTarget(ModelId('model')), (Message(Role.USER, Content((TextContent('hi'),))),)); run=InferenceRun(InferenceRunId('smoke'),req); assert INFERENCE_SCHEMA_VERSION == 1; assert request_from_dict(json.loads(json.dumps(request_to_dict(req)))) == req; assert run_to_dict(run_from_dict(json.loads(json.dumps(run_to_dict(run))))) == run_to_dict(run)"
      - name: L3.5 installed wheel full domain smoke
        run: |
          .venv-wheel/bin/python examples/12_full_inference_walkthrough.py
          .venv-wheel/bin/python -c "from pyllmkit import __version__; from pyllmkit.domain import INFERENCE_SCHEMA_VERSION, INTERACTION_SCHEMA_VERSION; from pyllmkit.domain.models.serialization import SCHEMA_VERSION; assert (__version__, INFERENCE_SCHEMA_VERSION, INTERACTION_SCHEMA_VERSION, SCHEMA_VERSION) == ('0.1.0a2', 1, 1, 1)"
      - name: Sdist clean environment smoke
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          .venv-sdist/bin/python -c "from pyllmkit.domain import Content, ImageContent, MediaSourceRef, Message, Role, TextContent, message_to_dict, message_from_dict; m=Message(Role.USER, Content((TextContent('x'), ImageContent(MediaSourceRef('asset', 'image-1'))))); assert message_from_dict(message_to_dict(m)) == m"
          .venv-sdist/bin/python -c "from pyllmkit.domain import GenerationConfig, DeploymentId, DeploymentTarget, InferenceRequest, Message, Content, Role, TextContent; r=InferenceRequest(DeploymentTarget(DeploymentId('dep-1')), (Message(Role.USER, Content((TextContent('test'),))),), GenerationConfig(temperature=0.0)); assert r.target.kind == 'deployment'"
          .venv-sdist/bin/python -c "from pyllmkit.domain import FinishReason, FinishReasonCode, InferenceResponse, InferenceRunId, TextOutput; x=InferenceResponse(InferenceRunId('smoke'), TextOutput(''), FinishReason(FinishReasonCode.UNKNOWN, 'vendor')); assert x.finish_reason.code is FinishReasonCode.UNKNOWN"
          .venv-sdist/bin/python -c "from datetime import datetime, timezone; from pyllmkit.domain import Content, Message, Role, TextContent, ModelId, ModelTarget, InferenceRequest, InferenceRun, InferenceRunId, InferenceFailure, InferenceRunState; r=InferenceRun(InferenceRunId('sdist'), InferenceRequest(ModelTarget(ModelId('model')), (Message(Role.USER, Content((TextContent('hi'),))),))); t=datetime(2026,11,5,tzinfo=timezone.utc); fail=r.start(t).fail(InferenceFailure('timeout'),t); assert fail.state is InferenceRunState.FAILED"
          .venv-sdist/bin/python -c "from datetime import UTC, datetime; from pyllmkit.domain import Content, Message, Role, TextContent, ModelId, ModelTarget, InferenceRequest, InferenceRun, InferenceRunId, InferenceFailure, InferenceRunState, run_from_dict, run_to_dict; r=InferenceRun(InferenceRunId('sdist-json'), InferenceRequest(ModelTarget(ModelId('model')), (Message(Role.USER, Content((TextContent('x'),))),))).start(datetime(2026,11,5,tzinfo=UTC)); failed=r.fail(InferenceFailure('timeout'),datetime(2026,11,5,tzinfo=UTC)); d=run_to_dict(failed); assert run_to_dict(run_from_dict(d)) == d"
          .venv-sdist/bin/python examples/12_full_inference_walkthrough.py
          .venv-sdist/bin/python examples/13_define_tools.py
          .venv-sdist/bin/python examples/14_define_tool_call_and_result.py
          .venv-sdist/bin/python examples/15_validate_structured_output.py
          .venv-sdist/bin/python examples/16_tooling_json_round_trip.py
          .venv-sdist/bin/python examples/17_full_tooling_walkthrough.py
          .venv-sdist/bin/python examples/18_stream_text_events.py
          .venv-sdist/bin/python examples/19_stream_tool_call_events.py
          .venv-sdist/bin/python examples/20_stream_sync_async.py
          .venv-sdist/bin/python examples/21_streaming_json_round_trip.py
          .venv-sdist/bin/python examples/22_full_streaming_walkthrough.py
          .venv-sdist/bin/python examples/23_define_provider_deployment.py
          .venv-sdist/bin/python examples/24_registry_search.py
          .venv-sdist/bin/python examples/25_effective_capabilities_limits.py
          .venv-sdist/bin/python examples/26_deployment_resolution.py
          .venv-sdist/bin/python examples/27_offline_discovery_merge.py
          .venv-sdist/bin/python examples/28_full_registry_walkthrough.py
